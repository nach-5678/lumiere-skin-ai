<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumière Skin AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-sage: #DAE5D0;
        --color-cream: #FDFBF7;
        --color-clay: #A0937D;
        --color-soft-black: #2C2C2C;
      }
      body {
        background-color: var(--color-cream);
        color: var(--color-soft-black);
        font-family: 'Outfit', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, h4, h5, h6, .display-font {
        font-family: 'Cormorant Garamond', serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Performance optimizations for smooth loading */
      .animate-enter {
        opacity: 0;
        transform: translateY(20px);
        animation: enter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        will-change: opacity, transform;
      }
      @keyframes enter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media print {
        body { background-color: white; }
        .no-print { display: none !important; }
        .print-break-inside { page-break-inside: avoid; }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                50: '#F4F9F4',
                100: '#E9F2E9',
                200: '#DAE5D0',
                300: '#C1D1B0',
                500: '#8FA88F',
                900: '#2C3A2C',
              },
              cream: '#FDFBF7',
              clay: '#A0937D',
              rose: {
                50: '#FDF2F2',
                100: '#FCE7E7',
                200: '#F8D1D1',
                300: '#F0AFAF',
              }
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', 'serif'],
              sans: ['"Outfit"', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 1s ease-out forwards',
              'slide-up': 'slideUp 0.8s ease-out forwards',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
